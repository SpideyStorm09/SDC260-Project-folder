<body>
    <header>
        <p>Welcome to the Figurine Store Experience!</p>

    <nav>
        <ul>

<header>
    <h1>Figurine Inventory</h1>
</header>

<table border="1">
    <tr>
        <th>Figurine Name</th>
        <th>Series</th>
        <th>Price ($)</th>

    <tr>
        <td>Dragon Knight</td>
        <td>Mythic Legends</td>

<section>
    <h2>Choose Your Figurine Store Location</h2>

    <form id="storeLocationForm">

        <select id="storeLocation" name="storeLocation">
            <option value="hackney">Hackney, London, UK</option>
            <option value="notting-hill">Notting Hill, London, UK</option>
            <option value="west-ham">West Ham, London, UK</option>
        </select>

        <button type="submit">Submit</button>
    </form>
