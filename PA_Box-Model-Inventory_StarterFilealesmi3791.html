<!DOCTYPE html>
<html lang="en">
<head>
    <!--
        Author: Alexander Smith 
        Date: 08/03/2026
        Purpose: Using what I learned to add semantic HTML elements and use CSS styling to develop a webpage. 
    -->
    <meta charset="UTF-8">
    <title>Box Model Inventory</title>

    <style>
        header {
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid #444;
        }

        table {
            margin: 20px auto;
            padding: 10px;
            border: 3px solid #222;
        }

        section {
            padding: 15px;
            margin-top: 20px;
            border: 2px dashed #666;
        }
    </style>
</head>

<body>
    <header>
        <p>Welcome to the Figurine Store Experience!</p>
    </header>
    <nav>
        <ul>
            <li><a href="#home">Main</a></li>
            <li><a href="#Products">Table</a></li>
            <li><a href="#Categories">Form</a></li>
        </ul>
    </nav>

<header>
    <h1>Figurine Inventory</h1>
</header>

<table border="1">
    <tr>
        <th>Figurine Name</th>
        <th>Series</th>
        <th>Price ($)</th>
    </tr>
    <tr>
        <td>Dragon Knight</td>
        <td>Mythic Legends</td>
        <td>29.99</td>
    </tr>
    <tr>
        <td>Star Ranger</td>
        <td>Galactic Heroes</td>
        <td>24.50</td>
    </tr>
    <tr>
        <td>Forest Guardian</td>
        <td>Nature Spirits</td>
        <td>18.75</td>
    </tr>
</table>

<section>
    <h2>Choose Your Figurine Store Location</h2>

    <form id="storeLocationForm">
        <label for="storeLocation">Select Desired Store Location:</label>
        <select id="storeLocation" name="storeLocation">
            <option value="hackney">Hackney, London, UK</option>
            <option value="notting-hill">Notting Hill, London, UK</option>
            <option value="west-ham">West Ham, London, UK</option>
        </select>

        <button type="submit">Submit</button>
    </form>
</section>

<footer style="background-color: #222; color: white; padding: 10px; text-align: center;">
        <p style="font-size: 14px; margin: 0;">© 2026 alesmi3791</p>
    </footer>

</body>
</html>
